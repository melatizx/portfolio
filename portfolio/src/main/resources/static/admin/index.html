<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="../icons/melati-logo.png" type="image/png">
</head>
<body>
<div class="admin-shell">

  <aside class="admin-sidebar">
    <div>
      <p class="admin-sidebar__brand"><img src="../icons/melati-logo.png" class="image-logo-melatidev"></p>
      <span class="admin-sidebar__tag">painel administrativo</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav__link">Dashboard</a>
      <a href="profile.html" class="admin-nav__link">Perfil / Hero</a>
      <a href="skills.html" class="admin-nav__link">Skills</a>
      <a href="projects.html" class="admin-nav__link">Projects</a>
      <a href="experience.html" class="admin-nav__link">Experience</a>
      <a href="education.html" class="admin-nav__link">Education</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a class="admin-view-site" href="/index.html" target="_blank" rel="noopener">Ver site público &#8599;</a>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Dashboard</h1>
        <p>Visão geral dos dados do portfólio.</p>
      </div>
    </div>

    <div class="dash-grid" id="dashGrid">
      <div class="dash-card"><span class="dash-card__count">—</span><span class="dash-card__label">Skills</span></div>
      <div class="dash-card"><span class="dash-card__count">—</span><span class="dash-card__label">Projects</span></div>
      <div class="dash-card"><span class="dash-card__count">—</span><span class="dash-card__label">Experience</span></div>
      <div class="dash-card"><span class="dash-card__count">—</span><span class="dash-card__label">Education</span></div>
    </div>
  </main>

</div>

<script src="js/admin-common.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const cards = document.querySelectorAll("#dashGrid .dash-card__count");
    const endpoints = ["/api/skills", "/api/projects", "/api/experiences", "/api/educations"];

    const results = await Promise.allSettled(endpoints.map(ep => AdminApi.get(ep)));

    results.forEach((result, i) => {
      cards[i].textContent = result.status === "fulfilled" ? result.value.length : "–";
    });
  });
</script>
</body>
</html>
