<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="../icons/melati-logo.png" type="image/png">
</head>
<body>
<div class="admin-shell">

  <aside class="admin-sidebar">
    <div>
      <p class="admin-sidebar__brand"><img src="../icons/melati-logo.png" class="image-logo-melatidev"></p>
      <span class="admin-sidebar__tag">painel administrativo</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav__link">Dashboard</a>
      <a href="profile.html" class="admin-nav__link">Perfil / Hero</a>
      <a href="skills.html" class="admin-nav__link">Skills</a>
      <a href="projects.html" class="admin-nav__link">Projects</a>
      <a href="experience.html" class="admin-nav__link">Experience</a>
      <a href="education.html" class="admin-nav__link">Education</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a class="admin-view-site" href="/index.html" target="_blank" rel="noopener">Ver site público &#8599;</a>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Skills</h1>
        <p>CRUD completo — os itens aparecem em <code>skills.html</code> como log de terminal, na ordem definida aqui.</p>
      </div>
      <button class="btn btn--primary" id="btnNew">+ Nova skill</button>
    </div>

    <div class="admin-card" id="formCard" hidden>
      <h3 id="formTitle" style="margin-bottom:16px;">Nova skill</h3>
      <form class="admin-form" id="skillForm">
        <input type="hidden" id="skillId">
        <div class="admin-form__field">
          <label for="name">Nome *</label>
          <input type="text" id="name" required placeholder="Ex: Java">
        </div>
        <div class="admin-form__field">
          <label for="category">Categoria *</label>
          <input type="text" id="category" required placeholder="Ex: Languages" list="categoryList">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="admin-form__field admin-form__field--full">
          <label for="note">Observação (opcional)</label>
          <input type="text" id="note" placeholder="Ex: Servers; Storages; Networkings">
        </div>
        <div class="admin-form__field">
          <label for="sortOrder">Ordem de exibição (opcional)</label>
          <input type="number" id="sortOrder" placeholder="deixe em branco para ir ao final">
        </div>
        <div class="admin-form__actions">
          <button type="submit" class="btn btn--primary">Salvar</button>
          <button type="button" class="btn" id="btnCancel">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Nome</th><th>Categoria</th><th>Observação</th><th>Ordem</th><th>Ações</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="5">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

<script src="js/admin-common.js"></script>
<script src="js/skills-admin.js"></script>
</body>
</html>
