<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="../icons/melati-logo.png" type="image/png">
</head>
<body>
<div class="admin-shell">

  <aside class="admin-sidebar">
    <div>
      <p class="admin-sidebar__brand"><img src="../icons/melati-logo.png" class="image-logo-melatidev"></p>
      <span class="admin-sidebar__tag">painel administrativo</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav__link">Dashboard</a>
      <a href="profile.html" class="admin-nav__link">Perfil / Hero</a>
      <a href="skills.html" class="admin-nav__link">Skills</a>
      <a href="projects.html" class="admin-nav__link">Projects</a>
      <a href="experience.html" class="admin-nav__link">Experience</a>
      <a href="education.html" class="admin-nav__link">Education</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a class="admin-view-site" href="/index.html" target="_blank" rel="noopener">Ver site público &#8599;</a>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Projects</h1>
        <p>Cada projeto pode estar associado a uma ou mais skills.</p>
      </div>
      <button class="btn btn--primary" id="btnNew">+ Novo projeto</button>
    </div>

    <div class="admin-card" id="formCard" hidden>
      <h3 id="formTitle" style="margin-bottom:16px;">Novo projeto</h3>
      <form class="admin-form" id="projectForm">
        <input type="hidden" id="projectId">
        <div class="admin-form__field admin-form__field--full">
          <label for="name">Nome *</label>
          <input type="text" id="name" required>
        </div>
        <div class="admin-form__field admin-form__field--full">
          <label for="description">Descrição *</label>
          <textarea id="description" required></textarea>
        </div>
        <div class="admin-form__field">
          <label for="githubUrl">URL do repositório</label>
          <input type="url" id="githubUrl" placeholder="https://github.com/...">
        </div>
        <div class="admin-form__field">
          <label for="liveUrl">URL do projeto no ar</label>
          <input type="url" id="liveUrl" placeholder="https://...">
        </div>
        <div class="admin-form__field admin-form__field--full">
          <label for="skillIds">Skills relacionadas</label>
          <select id="skillIds" multiple></select>
          <span class="admin-form__hint">Segure Ctrl (ou Cmd no Mac) para selecionar mais de uma.</span>
        </div>
        <div class="admin-form__actions">
          <button type="submit" class="btn btn--primary">Salvar</button>
          <button type="button" class="btn" id="btnCancel">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th>Nome</th><th>Descrição</th><th>Skills</th><th>Ações</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td colspan="4">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

<script src="js/admin-common.js"></script>
<script src="js/projects-admin.js"></script>
</body>
</html>
