<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="../icons/melati-logo.png" type="image/png">
</head>
<body>
<div class="admin-shell">

  <aside class="admin-sidebar">
    <div>
      <p class="admin-sidebar__brand"><img src="../icons/melati-logo.png" class="image-logo-melatidev"></p>
      <span class="admin-sidebar__tag">painel administrativo</span>
    </div>
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav__link">Dashboard</a>
      <a href="profile.html" class="admin-nav__link">Perfil / Hero</a>
      <a href="skills.html" class="admin-nav__link">Skills</a>
      <a href="projects.html" class="admin-nav__link">Projects</a>
      <a href="experience.html" class="admin-nav__link">Experience</a>
      <a href="education.html" class="admin-nav__link">Education</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a class="admin-view-site" href="/index.html" target="_blank" rel="noopener">Ver site público &#8599;</a>
      <button class="btn-logout" id="btnLogout">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Perfil / Hero</h1>
        <p>Usado na home, no About Me e no Contact do site público.</p>
      </div>
    </div>

    <div class="admin-card">
      <form class="admin-form admin-form--single" id="profileForm">
        <div class="admin-form__field">
          <label for="fullName">Nome completo *</label>
          <input type="text" id="fullName" required>
        </div>
        <div class="admin-form__field">
          <label for="role">Função / título *</label>
          <input type="text" id="role" required>
        </div>
        <div class="admin-form__field">
          <label for="tagline">Frase de destaque (hero)</label>
          <input type="text" id="tagline" maxlength="300">
        </div>
        <div class="admin-form__field">
          <label for="about">About me</label>
          <textarea id="about" rows="8" placeholder="Separe os parágrafos com uma linha em branco"></textarea>
        </div>
        <div class="admin-form__field">
          <label for="email">E-mail</label>
          <input type="email" id="email">
        </div>
        <div class="admin-form__field">
          <label for="linkedin">LinkedIn</label>
          <input type="url" id="linkedin">
        </div>
        <div class="admin-form__field">
          <label for="github">GitHub</label>
          <input type="url" id="github">
        </div>
        <div class="admin-form__field">
          <label for="location">Localização</label>
          <input type="text" id="location">
        </div>
        <div class="admin-form__actions">
          <button type="submit" class="btn btn--primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  </main>

</div>

<script src="js/admin-common.js"></script>
<script src="js/profile-admin.js"></script>
</body>
</html>
