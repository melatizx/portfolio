<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo Melati Ambrosio · Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/melati-logo.png" type="image/png">
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand"><img src="icons/melati-logo.png" class="image-logo-melatidev"></a>
      <nav class="navbar__links">
        <a href="about.html" class="nav-link">About Me</a>
        <a href="skills.html" class="nav-link">Skills</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="experience.html" class="nav-link">Experience</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <nav class="mobile-menu__links">
      <a href="about.html" class="mobile-link">About Me</a>
      <a href="skills.html" class="mobile-link">Skills</a>
      <a href="projects.html" class="mobile-link">Projects</a>
      <a href="experience.html" class="mobile-link">Experience</a>
      <a href="contact.html" class="mobile-link">Contact</a>
    </nav>
  </div>

  <main>
    <section class="hero">
      <div class="hero__grid">
        <div class="hero__content">
          <h1 class="hero__name" id="heroName"></h1>

          <div class="hero__terminal">
            <span class="hero__terminal-prompt">root@melati:~$</span>
            <span class="hero__terminal-text" id="heroTypedRole"></span><span class="hero__terminal-cursor" aria-hidden="true"></span>
          </div>

          <p class="hero__tagline" id="heroTagline"></p>
        </div>

        <div class="hero__servers" aria-hidden="true">
          <svg class="server-rack" viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="rackClip">
                <rect x="10" y="10" width="240" height="300" rx="14" />
              </clipPath>
              <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" style="stop-color:var(--blue-400); stop-opacity:0" />
                <stop offset="50%" style="stop-color:var(--blue-400); stop-opacity:0.32" />
                <stop offset="100%" style="stop-color:var(--blue-400); stop-opacity:0" />
              </linearGradient>
            </defs>

            <rect class="server-rack__frame" x="10" y="10" width="240" height="300" rx="14" />

            <g clip-path="url(#rackClip)">
              <rect class="server-rack__scanline" x="10" y="10" width="240" height="70" fill="url(#scanGradient)" />

              <!-- unidade 1 -->
              <rect class="server-rack__unit-body" x="26" y="26" width="208" height="44" rx="4" />
              <line class="server-rack__vent" x1="40" y1="36" x2="40" y2="60" />
              <line class="server-rack__vent" x1="48" y1="36" x2="48" y2="60" />
              <line class="server-rack__vent" x1="56" y1="36" x2="56" y2="60" />
              <line class="server-rack__vent" x1="64" y1="36" x2="64" y2="60" />
              <circle class="server-rack__led server-rack__led--blue" cx="206" cy="42" r="3.2" style="animation-delay:0s" />
              <circle class="server-rack__led server-rack__led--green" cx="218" cy="42" r="3.2" style="animation-delay:0.6s" />

              <!-- unidade 2 -->
              <rect class="server-rack__unit-body" x="26" y="82" width="208" height="44" rx="4" />
              <line class="server-rack__vent" x1="40" y1="92" x2="40" y2="116" />
              <line class="server-rack__vent" x1="48" y1="92" x2="48" y2="116" />
              <line class="server-rack__vent" x1="56" y1="92" x2="56" y2="116" />
              <line class="server-rack__vent" x1="64" y1="92" x2="64" y2="116" />
              <circle class="server-rack__led server-rack__led--blue" cx="206" cy="98" r="3.2" style="animation-delay:0.9s" />
              <circle class="server-rack__led server-rack__led--green" cx="218" cy="98" r="3.2" style="animation-delay:0.2s" />

              <!-- unidade 3 -->
              <rect class="server-rack__unit-body" x="26" y="138" width="208" height="44" rx="4" />
              <line class="server-rack__vent" x1="40" y1="148" x2="40" y2="172" />
              <line class="server-rack__vent" x1="48" y1="148" x2="48" y2="172" />
              <line class="server-rack__vent" x1="56" y1="148" x2="56" y2="172" />
              <line class="server-rack__vent" x1="64" y1="148" x2="64" y2="172" />
              <circle class="server-rack__led server-rack__led--blue" cx="206" cy="154" r="3.2" style="animation-delay:1.4s" />
              <circle class="server-rack__led server-rack__led--green" cx="218" cy="154" r="3.2" style="animation-delay:0.4s" />

              <!-- unidade 4 -->
              <rect class="server-rack__unit-body" x="26" y="194" width="208" height="44" rx="4" />
              <line class="server-rack__vent" x1="40" y1="204" x2="40" y2="228" />
              <line class="server-rack__vent" x1="48" y1="204" x2="48" y2="228" />
              <line class="server-rack__vent" x1="56" y1="204" x2="56" y2="228" />
              <line class="server-rack__vent" x1="64" y1="204" x2="64" y2="228" />
              <circle class="server-rack__led server-rack__led--blue" cx="206" cy="210" r="3.2" style="animation-delay:0.3s" />
              <circle class="server-rack__led server-rack__led--green" cx="218" cy="210" r="3.2" style="animation-delay:1.1s" />

              <!-- unidade 5 -->
              <rect class="server-rack__unit-body" x="26" y="250" width="208" height="44" rx="4" />
              <line class="server-rack__vent" x1="40" y1="260" x2="40" y2="284" />
              <line class="server-rack__vent" x1="48" y1="260" x2="48" y2="284" />
              <line class="server-rack__vent" x1="56" y1="260" x2="56" y2="284" />
              <line class="server-rack__vent" x1="64" y1="260" x2="64" y2="284" />
              <circle class="server-rack__led server-rack__led--blue" cx="206" cy="266" r="3.2" style="animation-delay:1.7s" />
              <circle class="server-rack__led server-rack__led--green" cx="218" cy="266" r="3.2" style="animation-delay:0.8s" />
            </g>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="footerYear"></span> Leonardo Melati Ambrosio</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
