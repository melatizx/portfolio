<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Leonardo Melati Ambrosio · Portfólio</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons-img/melati-logo.png" type="image/png">
</head>

<body>

  <!-- Camada global de infraestrutura (decorativa; montada por js/infra.js) -->
  <div class="infrastructure-background" id="infra" aria-hidden="true">
    <div class="infra-stage">
      <div class="infra-layer infra-layer--far"></div>
      <div class="infra-layer infra-layer--mid"></div>
      <div class="infra-layer infra-layer--near"></div>
    </div>
  </div>

  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="#hero" class="navbar__brand" aria-label="Início"><img src="icons-img/melati-logo.png" alt=""
          class="navbar__logo"></a>
      <nav class="navbar__links" aria-label="Principal">
        <a href="#about" class="nav-link">About</a>
        <a href="#skills" class="nav-link">Skills</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="#experience" class="nav-link">Experience</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <nav class="mobile-menu__links" aria-label="Menu mobile">
      <a href="#about" class="mobile-link">About</a>
      <a href="#skills" class="mobile-link">Skills</a>
      <a href="#projects" class="mobile-link">Projects</a>
      <a href="#experience" class="mobile-link">Experience</a>
      <a href="#contact" class="mobile-link">Contact</a>
    </nav>
  </div>

  <main>
    <section id="hero" class="hero">
      <div class="hero__content">
        <p class="hero__role"><span class="hero__role-led" aria-hidden="true"></span><span
            id="heroTypedRole"></span><span class="hero__role-cursor" aria-hidden="true"></span></p>
        <h1 class="hero__name" id="heroName"></h1>
        <p class="hero__tagline" id="heroTagline"></p>
      </div>

      <a href="#about" class="hero__scroll" aria-label="Rolar para baixo"><span></span></a>
    </section>

    <section id="about" class="section about">
      <div class="wrap">
        <header class="section__head reveal">
          <h2 class="section__title">About</h2>
        </header>
        <div class="about__body" id="aboutBody">
          <p class="loading-state">Carregando...</p>
        </div>
      </div>
    </section>

    <section id="skills" class="section skills">
      <div class="wrap">
        <header class="section__head reveal">
          <h2 class="section__title">Skills</h2>
        </header>
        <div class="skills-toolbar reveal">
          <input type="search" id="skillsSearch" class="skills-search" placeholder="Buscar"
            aria-label="Buscar skill ou categoria" autocomplete="off">
          <span class="skills-toolbar__count" id="skillsCount"></span>
        </div>
        <div class="skills-board" id="skillsBoard">
          <p class="loading-state">Carregando...</p>
        </div>
      </div>
    </section>

    <section id="projects" class="section projects">
      <div class="wrap">
        <header class="section__head reveal">
          <h2 class="section__title">Projects</h2>
        </header>
        <div class="projects__list" id="projectsList">
          <p class="loading-state">Carregando...</p>
        </div>
      </div>
    </section>

    <section id="experience" class="section experience">
      <div class="wrap">
        <header class="section__head reveal">
          <h2 class="section__title">Experience</h2>
        </header>

        <div class="timeline-block">
          <h3 class="timeline-block__title reveal">Experiência Profissional</h3>
          <div class="timeline" id="experienceTimeline">
            <p class="loading-state">Carregando...</p>
          </div>
        </div>

        <div class="timeline-block">
          <h3 class="timeline-block__title reveal">Formação Acadêmica</h3>
          <div class="timeline" id="educationTimeline">
            <p class="loading-state">Carregando...</p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section contact">
      <div class="wrap">
        <header class="section__head reveal">
          <h2 class="section__title section__title--xl">Let&rsquo;s build<br>something.</h2>
        </header>
        <div class="contact__links" id="contactLinks">
          <p class="loading-state">Carregando...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p>© <span id="footerYear"></span></p>
      <a href="#hero" class="footer__top">Topo ↑</a>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/infra.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
