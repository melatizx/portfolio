spring.application.name=portfolio

# Railway injeta a variavel PORT em runtime; localmente cai no 8080.
server.port=${PORT:8080}

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Credenciais do painel administrativo (/admin). Troque via variaveis de
# ambiente antes de publicar - o valor apos ":" e so um fallback local.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}